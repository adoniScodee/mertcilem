```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çilem ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: #050008;
    font-family: Arial, sans-serif;
    color: white;
}

/* Arka plan */
.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 50%, #5d003d 0%, #17001c 35%, #050008 75%);
    animation: bgPulse 5s infinite alternate;
}

@keyframes bgPulse {
    from { filter: brightness(.8); }
    to { filter: brightness(1.25); }
}

/* Yıldızlar */
.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#ffb6e6 1px, transparent 1px);
    background-size: 70px 70px, 110px 110px;
    animation: starsMove 15s linear infinite;
    opacity: .6;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-100px); }
}

/* Ana içerik */
.container {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
}

.message {
    opacity: 0;
    transform: scale(.2);
    animation: reveal 2s cubic-bezier(.17,.89,.32,1.49) 2s forwards;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(.2) rotate(-8deg);
    }
    60% {
        opacity: 1;
        transform: scale(1.15) rotate(3deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

.small {
    font-size: 20px;
    letter-spacing: 8px;
    color: #ffc7ec;
    margin-bottom: 20px;
    animation: glow 2s infinite alternate;
}

.name {
    font-size: clamp(60px, 15vw, 150px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(
        90deg,
        #ff69b4,
        #fff,
        #ff1493,
        #ffd1ec,
        #ff69b4
    );
    background-size: 300%;
    -webkit-background-clip: text;
    color: transparent;
    animation:
        gradient 4s linear infinite,
        float 3s ease-in-out infinite;
    text-shadow: 0 0 40px #ff1493;
}

.love {
    margin-top: 25px;
    font-size: clamp(30px, 7vw, 65px);
    font-weight: bold;
    color: white;
    text-shadow:
        0 0 10px #ff1493,
        0 0 30px #ff1493,
        0 0 60px #ff1493;
    animation: heartbeat 1.2s infinite;
}

@keyframes gradient {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.12); }
    30% { transform: scale(1); }
    45% { transform: scale(1.08); }
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ff69b4; }
    to { text-shadow: 0 0 25px #ff1493; }
}

/* Kalpler */
.heart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    animation: rise linear forwards;
    pointer-events: none;
    z-index: 3;
}

@keyframes rise {
    0% {
        transform: translateY(0) scale(.5) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(var(--x))
            scale(1.4)
            rotate(360deg);
        opacity: 0;
    }
}

/* Işık patlaması */
.flash {
    position: fixed;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
        0 0 20px white,
        0 0 60px #ff69b4,
        0 0 120px #ff1493;
    animation: flash 2s ease-out forwards;
    z-index: 10;
}

@keyframes flash {
    0% {
        width: 10px;
        height: 10px;
        opacity: 1;
    }
    100% {
        width: 200vw;
        height: 200vw;
        opacity: 0;
    }
}

/* Alt yazı */
.footer {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffb6df;
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0;
    animation: footerIn 2s ease 5s forwards;
}

@keyframes footerIn {
    to { opacity: .8; }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="stars"></div>

<div class="flash"></div>

<div class="container">
    <div class="message">
        <div class="small">SADECE SENİN İÇİN...</div>

        <div class="name">ÇİLEM</div>

        <div class="love">
            ❤️ SENİ SEVİYORUM ❤️
        </div>
    </div>
</div>

<div class="footer">
    BAZI İSİMLER KALBE YAZILIR... ❤️
</div>

<script>

/* Kalp yağmuru */
function createHeart() {

    const heart = document.createElement("div");

    const hearts = ["❤️","💗","💖","💕","💓","💘","💞"];

    heart.className = "heart";
    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 35) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    heart.style.setProperty(
        "--x",
        (-150 + Math.random() * 300) + "px"
    );

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 180);

/* İlk anda ekstra kalp patlaması */
setTimeout(() => {

    for(let i = 0; i < 50; i++) {

        setTimeout(() => {
            createHeart();
        }, i * 30);

    }

}, 1800);


/* Ekrana tıklayınca kalp patlaması */
document.addEventListener("click", function(e) {

    for(let i = 0; i < 25; i++) {

        const heart = document.createElement("div");

        heart.innerHTML = "❤️";
        heart.style.position = "fixed";
        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.fontSize = "25px";
        heart.style.zIndex = "20";
        heart.style.pointerEvents = "none";

        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 200;

        heart.animate([
            {
                transform: "translate(-50%,-50%) scale(.3)",
                opacity: 1
            },
            {
                transform:
                    `translate(
                    ${Math.cos(angle)*distance}px,
                    ${Math.sin(angle)*distance}px
                    ) scale(1.5)`,
                opacity: 0
            }
        ], {
            duration: 1200,
            easing: "cubic-bezier(.17,.67,.83,.67)"
        });

        setTimeout(() => heart.remove(), 1300);
    }

});

</script>

</body>
</html>
```
